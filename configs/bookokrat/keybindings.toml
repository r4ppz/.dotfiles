# Bookokrat keybindings — user overrides go here.
#
# Run `bookokrat --print-default-keybindings` to see every default binding
# and available action. To override, write one line per binding using dotted
# TOML keys, or group bindings under a `[context]` header. Examples:
#
#   content."j" = "scroll_up"         # reverse scroll direction
#   global."<C-q>" = "nop"            # disable the Ctrl+Q suspend default
#
#   # equivalent grouped form:
#   [content]
#   "j" = "scroll_up"
#
# Groups `all`, `normal`, `popup` apply across multiple contexts.
# Use "nop" as the action to disable a default binding.


[global]
"<C-l>" = "force_redraw"                # Force a full-screen redraw
"<C-q>" = "suspend"                     # Suspend the process (job control)
"<C-r>" = "reload_keybindings"          # Reload keybindings.toml (shows a modal with errors if any)
"<C-s>" = "open_settings"               # Open the settings popup
"<C-z>" = "toggle_zen_mode"             # Toggle zen mode (hide navigation panel)
"<Space><gt>" = "reset_nav_panel_width" # Reset the navigation panel to its default width
"<Space><lt>" = "reset_nav_panel_width" # Reset the navigation panel to its default width
"<Space>C" = "copy_toc_item"            # Copy the selected TOC entry (PDF)
"<Space>D" = "toggle_pdf_page_layout"   # Toggle dual layout (PDF pages / EPUB columns)
"<Space>F" = "open_book_search_fresh"   # Start a fresh book-wide search
"<Space>S" = "toggle_pdf_render_mode"   # Toggle scroll / page render mode (PDF)
"<Space>a" = "toggle_comments_viewer"   # Toggle the comments viewer popup
"<Space>b" = "toggle_zen_border"        # Toggle the border/frame in zen mode
"<Space>c" = "copy_chapter_text"        # Copy chapter text (EPUB) / page text (PDF)
"<Space>d" = "toggle_book_stats"        # Toggle the book statistics popup
"<Space>f" = "open_book_search"         # Reopen the last book-wide search
"<Space>g" = "go_to_page"               # Jump to a specific page number (PDF)
"<Space>h" = "toggle_reading_history"   # Toggle the reading history popup
"<Space>j" = "toggle_justify_text"      # Toggle justified text rendering (EPUB)
"<Space>l" = "lookup_selection"         # Run the configured lookup command on the selection
"<Space>o" = "open_external_viewer"     # Open the current book in an external viewer
"<Space>s" = "open_settings"            # Open the settings popup
"<Space>t" = "open_theme_selector"      # Open the theme selector popup
"<Space>w" = "toggle_pdf_watching"      # Toggle file watching / auto-reload (PDF)
"<Space>z" = "toggle_zen_mode"          # Toggle zen mode (hide navigation panel)
"<gt>" = "expand_nav_panel"             # Expand the navigation panel by one step
"<lt>" = "shrink_nav_panel"             # Shrink the navigation panel by one step
"?" = "toggle_help"                     # Toggle the help popup

